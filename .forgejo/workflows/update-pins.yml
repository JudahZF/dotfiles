name: Update dependency pins

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

concurrency:
  group: update-dependency-pins
  cancel-in-progress: false

jobs:
  update:
    runs-on: nix-linux
    timeout-minutes: 180
    env:
      UPDATE_BRANCH: automation/update-pins
      TARGET_BRANCH: main
      DOTFILES_AUTOMATION_TOKEN: ${{ secrets.DOTFILES_AUTOMATION_TOKEN }}
      DOTFILES_AUTOMATION_USER: ${{ secrets.DOTFILES_AUTOMATION_USER }}
      NIX_GITHUB_TOKEN: ${{ secrets.NIX_GITHUB_TOKEN }}
      FORGEJO_SERVER_URL: ${{ github.server_url }}
      FORGEJO_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: main

      - name: Update pins and publish pull request
        run: |
          set -euo pipefail

          test -n "$DOTFILES_AUTOMATION_TOKEN"
          test -n "$DOTFILES_AUTOMATION_USER"

          nix develop ./nix -c bash nix/_internal_update.sh

          changed_files="$(git diff --name-only)"
          if [[ -z "$changed_files" ]]; then
            echo "Dependency pins are current."
            exit 0
          fi

          unexpected="$(printf '%s\n' "$changed_files" | grep -Ev '^(nix/flake\.lock|nix/packages/t3code\.nix)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Updater changed unexpected files:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

          askpass="$(mktemp)"
          trap 'rm -f "$askpass"' EXIT
          cat >"$askpass" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' "$DOTFILES_AUTOMATION_USER" ;;
            *Password*) printf '%s\n' "$DOTFILES_AUTOMATION_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0

          remote_line="$(git ls-remote origin "refs/heads/$UPDATE_BRANCH")"
          remote_sha="${remote_line%%[[:space:]]*}"
          if [[ -n "$remote_sha" ]]; then
            git fetch origin "+refs/heads/$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH"
            if git diff --quiet "$remote_sha" -- nix/flake.lock nix/packages/t3code.nix; then
              echo "Existing update branch already contains these pins."
              UPDATE_HEAD_COMMIT="$remote_sha" scripts/forgejo-update-pr.sh
              exit 0
            fi
          fi

          git config user.name "Dotfiles Update Bot"
          git config user.email "dotfiles-update-bot@noreply.codeberg.org"
          git switch -C "$UPDATE_BRANCH"
          git add nix/flake.lock nix/packages/t3code.nix
          git commit -m "Update dependency pins"

          git push \
            "--force-with-lease=refs/heads/$UPDATE_BRANCH:$remote_sha" \
            origin "HEAD:refs/heads/$UPDATE_BRANCH"

          scripts/forgejo-update-pr.sh
